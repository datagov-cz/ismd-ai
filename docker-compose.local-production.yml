services:
  server:
    build:
      context: .
    image: semantic-modeling-assistant:local
    ports:
      - "8080:8080"
    environment:
      LOGGING_LEVEL_ROOT: DEBUG    
      APP_ENVIRONMENT: production
      OIDC_ISSUER_URI: http://localhost:8081/realms/ismd
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/ismd/protocol/openid-connect/certs
      APP_SPARQL_ENDPOINT_URL: ${APP_SPARQL_ENDPOINT_URL:-https://opendata.eselpoint.gov.cz/sparql}
      APP_SPARQL_TIMEOUT: ${APP_SPARQL_TIMEOUT:-10s}
      APP_SPARQL_MAX_ATTEMPTS: ${APP_SPARQL_MAX_ATTEMPTS:-3}
      APP_SPARQL_RETRY_BACKOFF: ${APP_SPARQL_RETRY_BACKOFF:-250ms}
      APP_TOKENS_MAX_ALLOWED_PER_DAY: ${APP_TOKENS_MAX_ALLOWED_PER_DAY:-100000}
      APP_LLM_ENABLED: ${APP_LLM_ENABLED:-false}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-OPENAI}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-gpt-4o-mini}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_ENDPOINT_URL: ${APP_LLM_ENDPOINT_URL:-}
      APP_LLM_MAX_TOKENS: ${APP_LLM_MAX_TOKENS:-1024}
      APP_LLM_TEMPERATURE: ${APP_LLM_TEMPERATURE:-}
      APP_LLM_REASONING_EFFORT: ${APP_LLM_REASONING_EFFORT:-}
      APP_LLM_TEXT_VERBOSITY: ${APP_LLM_TEXT_VERBOSITY:-}
      APP_LLM_TIMEOUT: ${APP_LLM_TIMEOUT:-60s}
      APP_LLM_LOG_INTERACTIONS: ${APP_LLM_LOG_INTERACTIONS:-false}
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: ${APP_DB_NAME:-ismd}
      APP_DB_USER: ${APP_DB_USER:-ismd}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-ismd}
      APP_DB_TIME_ZONE: ${APP_DB_TIME_ZONE:-Europe/Prague}
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./local/keycloak/ismd-realm.json:/opt/keycloak/data/import/ismd-realm.json:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-ismd}
      POSTGRES_USER: ${APP_DB_USER:-ismd}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-ismd}
    ports:
      - "5432:5432"
    volumes:
      - local-production-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  local-production-postgres-data:
