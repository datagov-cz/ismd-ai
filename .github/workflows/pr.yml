name: PR Workflow

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  run-tests:
    uses: ./.github/workflows/reusable-test.yml
    secrets: inherit

  # Build-only validation: proves the image builds, without publishing to GHCR.
  validate-docker-build:
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      branch: ${{ github.base_ref }}
      push: false
    secrets: inherit

  # Fails a PR that adds, or upgrades to, a dependency with a known high or critical
  # vulnerability. It compares the base and head manifests, so dependencies that are already
  # vulnerable on the base branch don't block. Image-level CVEs stay with trivy.yml (report only).
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  # The single required status check. Job names above can change without editing the rulesets.
  # Skipped jobs pass; failed or cancelled jobs fail the gate.
  pr-gate:
    name: PR gate
    if: always()
    needs: [run-tests, validate-docker-build, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$r'"; exit 1 ;;
            esac
          done
