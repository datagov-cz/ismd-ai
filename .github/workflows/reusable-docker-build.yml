name: Reusable Docker Build Workflow

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch name (main or dev)'
        required: true
        type: string
      version:
        description: 'Version to use (from Git tag), leave empty to auto-detect'
        required: false
        type: string
        default: ''
      push:
        description: 'Whether to push the image to GHCR (false = build-only validation)'
        required: false
        type: boolean
        default: true

# No top-level permissions block: a reusable workflow may not request more than
# its caller grants. Callers set what they need — push-to-dev/main grant
# packages: write; pr.yml grants packages: read (its build is push: false).

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history to get tags

      - name: Login to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up repository path
        id: repo-setup
        run: |
          # Convert repository name to lowercase and set as base path
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Append branch suffix for non-main branches (dev images publish to <repo>-dev)
          if [ "${{ inputs.branch }}" != "main" ]; then
            REPO_PATH="${REPO_PATH}-${{ inputs.branch }}"
          fi

          echo "REPO_PATH=${REPO_PATH}" >> $GITHUB_ENV

      - name: Get version info
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              BASE_VERSION="0.0.1"
            else
              BASE_VERSION=$(echo "$TAG" | sed 's/^v//')
            fi

            if [ "${{ inputs.branch }}" = "main" ]; then
              VERSION="$BASE_VERSION"
            else
              VERSION="${BASE_VERSION}-$(git rev-parse --short HEAD)"
            fi
          fi

          GIT_SHA=$(git rev-parse --short HEAD)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_sha=$GIT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="ghcr.io/${{ env.REPO_PATH }}:${{ steps.version.outputs.version }}"
          LATEST_TAG="ghcr.io/${{ env.REPO_PATH }}:latest"

          PUSH_FLAG=""
          if [ "${{ inputs.push }}" = "true" ]; then
            PUSH_FLAG="--push"
          fi

          # amd64-only: the container apps run amd64, and a Maven build under QEMU
          # arm64 emulation roughly doubles build time and is flaky. Add arm64 later
          # if a local-dev pull convenience is needed.
          docker buildx build \
            -f Dockerfile \
            --platform linux/amd64 \
            -t "$IMAGE_TAG" \
            -t "$LATEST_TAG" \
            $PUSH_FLAG \
            .
