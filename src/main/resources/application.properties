spring.application.name=semantic-modeling-assistant
app.environment=${APP_ENVIRONMENT:production}
spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.include-message=always

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/ismd}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8081/realms/ismd/protocol/openid-connect/certs}

app.sparql.endpoint-url=${APP_SPARQL_ENDPOINT_URL:https://opendata.eselpoint.gov.cz/sparql}
app.sparql.eli.namespace=https://opendata.eselpoint.gov.cz/esel-esb/eli/cz/sb/
app.sparql.timeout=${APP_SPARQL_TIMEOUT:10s}
app.sparql.max-attempts=${APP_SPARQL_MAX_ATTEMPTS:3}
app.sparql.retry-backoff=${APP_SPARQL_RETRY_BACKOFF:250ms}
app.tokens.max-allowed-per-day=${APP_TOKENS_MAX_ALLOWED_PER_DAY:1000}
app.llm.enabled=${APP_LLM_ENABLED:false}
app.llm.provider=${APP_LLM_PROVIDER:OPENAI}
app.llm.endpoint-url=${APP_LLM_ENDPOINT_URL:}
app.llm.model=${APP_LLM_MODEL:gpt-4o-mini}
app.llm.api-key=${APP_LLM_API_KEY:}
app.llm.max-tokens=${APP_LLM_MAX_TOKENS:1024}
app.llm.temperature=${APP_LLM_TEMPERATURE:0.2}
app.llm.timeout=${APP_LLM_TIMEOUT:60s}

spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/${APP_DB_NAME:ismd}
spring.datasource.username=${APP_DB_USER:ismd}
spring.datasource.password=${APP_DB_PASSWORD:ismd}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${APP_DB_TIME_ZONE:Europe/Prague}'
spring.sql.init.mode=always
