spring.application.name=semantic-modeling-assistant
spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.include-message=always

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/ismd}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8081/realms/ismd/protocol/openid-connect/certs}

app.sparql.endpoint-url=${APP_SPARQL_ENDPOINT_URL:https://example.org/sparql}
app.tokens.max-allowed-per-day=${APP_TOKENS_MAX_ALLOWED_PER_DAY:100000}
app.llm.enabled=${APP_LLM_ENABLED:false}
app.llm.provider=${APP_LLM_PROVIDER:OPENAI}
app.llm.endpoint-url=${APP_LLM_ENDPOINT_URL:}
app.llm.model=${APP_LLM_MODEL:gpt-4o-mini}
app.llm.api-key=${APP_LLM_API_KEY:}
app.llm.max-tokens=${APP_LLM_MAX_TOKENS:1024}
app.llm.temperature=${APP_LLM_TEMPERATURE:0.2}
app.llm.timeout=${APP_LLM_TIMEOUT:60s}

spring.datasource.url=jdbc:sqlite:${APP_DB_PATH:db.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
