services:
  server:
    build:
      context: .
    image: semantic-modeling-assistant:local
    ports:
      - "8080:8080"
    environment:
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8081/realms/ismd}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://localhost:8081/realms/ismd/protocol/openid-connect/certs}
      APP_SPARQL_ENDPOINT_URL: ${APP_SPARQL_ENDPOINT_URL:-https://example.org/sparql}
      APP_TOKENS_MAX_ALLOWED_PER_DAY: ${APP_TOKENS_MAX_ALLOWED_PER_DAY:-100000}
      APP_LLM_ENABLED: ${APP_LLM_ENABLED:-false}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-OPENAI}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-gpt-4o-mini}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_ENDPOINT_URL: ${APP_LLM_ENDPOINT_URL:-}
      APP_LLM_MAX_TOKENS: ${APP_LLM_MAX_TOKENS:-1024}
      APP_LLM_TEMPERATURE: ${APP_LLM_TEMPERATURE:-0.2}
      APP_LLM_TIMEOUT: ${APP_LLM_TIMEOUT:-60s}
      APP_FEEDBACK_DB_PATH: /data/feedback.sqlite
    volumes:
      - ./data:/data
    restart: unless-stopped
